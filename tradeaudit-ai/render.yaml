services:
  - type: web
    name: tradeaudit-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd backend/backend && npm install
    startCommand: cd backend/backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: GROQ_API_KEY
        sync: false
    healthCheckPath: /

  - type: static
    name: tradeaudit-frontend
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /**
        destination: /index.html
